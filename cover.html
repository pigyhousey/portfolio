<meta name="viewport" content="width=device-width, initial-scale=1">
<title>规划项目策划书Agent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap">
<style>
:root {
  --bg:     #f7f9fc;
  --navy:   #0d1f5c;
  --blue:   #1a3fa3;
  --mid:    #2d5be3;
  --sub:    #4a5e7a;
  --muted:  #8a9ab5;
  --grid:   rgba(26,63,163,.07);
  --warn:   #92400e;
  --warn-bg:#fffbeb;
  --warn-bd:#fde68a;
  --font: "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:     #080f20;
    --navy:   #c5d5f7;
    --blue:   #7aa3ff;
    --mid:    #7aa3ff;
    --sub:    #8aa0bc;
    --muted:  #4a6180;
    --grid:   rgba(100,149,255,.07);
    --warn:   #fbbf24;
    --warn-bg:#1a1000;
    --warn-bd:#3d2800;
  }
}
:root[data-theme="dark"] {
  --bg:     #080f20;
  --navy:   #c5d5f7;
  --blue:   #7aa3ff;
  --mid:    #7aa3ff;
  --sub:    #8aa0bc;
  --muted:  #4a6180;
  --grid:   rgba(100,149,255,.07);
  --warn:   #fbbf24;
  --warn-bg:#1a1000;
  --warn-bd:#3d2800;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--navy);
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

.grid-v, .grid-h {
  position: fixed;
  pointer-events: none;
  background: var(--grid);
}
.grid-v { left:50%; top:0; bottom:0; width:1px; transform:translateX(-50%); }
.grid-h { top:50%; left:0; right:0; height:1px; transform:translateY(-50%); }

.stage {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 48px 32px;
  max-width: 700px;
  width: 100%;
  animation: rise .65s cubic-bezier(.16,1,.3,1) both;
}

@keyframes rise {
  from { opacity:0; transform:translateY(20px); }
  to   { opacity:1; transform:translateY(0); }
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--mid);
  background: rgba(45,91,227,.07);
  border: 1px solid rgba(45,91,227,.18);
  border-radius: 100px;
  padding: 5px 14px;
  margin-bottom: 36px;
}
.badge-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--mid);
  animation: blink 2.4s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.25;} }

h1 {
  font-size: clamp(36px, 7.5vw, 58px);
  font-weight: 900;
  letter-spacing: -.03em;
  line-height: 1.1;
  color: var(--navy);
  margin-bottom: 22px;
  text-wrap: balance;
}

.sub {
  font-size: 17px;
  color: var(--sub);
  line-height: 1.75;
  margin-bottom: 14px;
  font-weight: 400;
}
.sub strong { font-weight: 600; color: var(--blue); }

.divider {
  width: 36px; height: 1px; border: none;
  background: rgba(26,63,163,.18);
  margin: 0 auto 14px;
}

.flow {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.7;
  letter-spacing: .01em;
  margin-bottom: 44px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 17px 52px;
  border: 2px solid var(--blue);
  border-radius: 9px;
  background: transparent;
  color: var(--blue);
  font-family: var(--font);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .05em;
  text-decoration: none;
  cursor: pointer;
  transition: background .2s, color .2s, transform .15s, box-shadow .2s;
}
.btn:hover {
  background: var(--blue);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(26,63,163,.22);
}
.btn:active { transform: translateY(0); box-shadow: none; }
.btn-arrow { font-size: 18px; line-height: 1; transition: transform .2s; }
.btn:hover .btn-arrow { transform: translateX(5px); }

/* 预热提示 — 放在按钮下方，明显可见 */
.warm-hint {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  padding: 8px 16px;
  background: var(--warn-bg);
  border: 1px solid var(--warn-bd);
  border-radius: 8px;
  font-size: 13px;
  color: var(--warn);
  line-height: 1.5;
}
.warm-icon { font-size: 15px; flex-shrink: 0; }
.warm-text { text-align: left; }

@media (max-width: 480px) {
  .stage { padding: 32px 20px; }
  .badge { margin-bottom: 28px; }
  h1 { margin-bottom: 18px; }
  .sub { font-size: 15px; }
  .flow { font-size: 12.5px; margin-bottom: 36px; }
  .btn { padding: 15px 36px; font-size: 16px; }
  .warm-hint { font-size: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .stage { animation: none; }
  .badge-dot { animation: none; }
  .btn, .btn-arrow { transition: none; }
}
</style>

<div class="grid-v"></div>
<div class="grid-h"></div>

<div class="stage">
  <div class="badge"><span class="badge-dot"></span>Demo · 2026</div>
  <h1>规划项目策划书Agent</h1>
  <p class="sub">规划师提供需求，AI生成规划项目策划书<br><strong>（大纲 + 正文 + 展示版）</strong></p>
  <hr class="divider">
  <p class="flow">主要流程 6 步：信息收集 → 选择模板 → 生成大纲 → 确认大纲 → 生成正文 → 生成展示版</p>
  <a href="https://proposal-agent-5wm6.onrender.com/chat" class="btn" id="startBtn">
    开始体验 <span class="btn-arrow">→</span>
  </a>
  <div>
    <div class="warm-hint" id="warmHint">
      <span class="warm-icon">⏳</span>
      <span class="warm-text" id="warmText">服务器预热中，点击后首次加载约需 30 秒</span>
    </div>
  </div>
</div>

<script>
(function () {
  var RENDER = 'https://proposal-agent-5wm6.onrender.com/chat';
  var hint = document.getElementById('warmHint');
  var text = document.getElementById('warmText');
  var icon = document.querySelector('.warm-icon');
  var done = false;

  function markReady() {
    if (done) return;
    done = true;
    icon.textContent = '✅';
    text.textContent = '服务器已就绪，点击即可进入';
    hint.style.background = '#f0fdf4';
    hint.style.borderColor = '#86efac';
    hint.style.color = '#166534';
  }

  // 页面加载后立即发请求预热 Render
  window.addEventListener('load', function () {
    var t = Date.now();
    fetch(RENDER, { mode: 'no-cors' })
      .then(function () {
        // no-cors 下拿不到状态码，但请求能完成说明服务器在线
        markReady();
      })
      .catch(function () {
        // 请求失败也不报错，提示保持原样
      });

    // 兜底：30 秒后无论如何都改为就绪（避免用户一直看到"预热中"）
    setTimeout(markReady, 30000);
  });
})();
</script>
